name: Build release packages

# Builds the Linux and Windows packages, and the wheel.
#
# The tests are NOT repeated here — Tests (tests.yml) already runs them on
# every push and pull request, across both platforms and two Python
# versions. Running them again would double every push's CI for no extra
# signal. A tag is the one case worth gating, so the release job checks
# that the suite passed for that commit before publishing anything.
#
# Windows runners are why this is on GitHub: PyInstaller cannot
# cross-compile, and GitHub gives public repositories free Windows runners.

on:
  push:
    tags: ["v*"]
    # Packaging changes also build, since a broken spec otherwise stays
    # hidden until a tag. Ordinary commits do not.
    branches: [master]
    paths:
      - "packaging/**"
      - "vcut-gui.spec"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/release.yml"
  pull_request:
    paths:
      - "packaging/**"
      - "vcut-gui.spec"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/release.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Keyed on the run, not just the ref, so a re-run never cancels itself or
  # the run it is repeating. A newer *push* still supersedes an in-flight
  # build of the same ref; tags always finish.
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.run_id }}
  cancel-in-progress: false

env:
  # The interpreter the packages are built against. The bundle embeds it.
  VCUT_PYTHON: "3.12"

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
      - name: Install the Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 \
            libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 \
            libpulse0 libasound2t64 || \
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 \
            libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 \
            libpulse0 libasound2
      - run: uv python install ${{ env.VCUT_PYTHON }}
      - name: Build
        run: ./packaging/build-linux.sh
      # The build script already starts the bundle; this checks the archive
      # itself, which is what people actually download.
      - name: Check the archive
        run: |
          test -f dist/vcut-gui-linux.tar.gz
          tar tzf dist/vcut-gui-linux.tar.gz > /dev/null
          tar tzf dist/vcut-gui-linux.tar.gz | grep -q 'vcut-gui/vcut-gui$'
          echo "Size: $(du -h dist/vcut-gui-linux.tar.gz | cut -f1)"
          # Qt WebEngine is excluded deliberately; if it reappears the
          # download roughly doubles for a browser that cannot start.
          if tar tzf dist/vcut-gui-linux.tar.gz | grep -qi webengine; then
            echo "::error::Qt WebEngine is back in the bundle (see docs/BUILDING.md)"
            exit 1
          fi
      - name: Say where the package is
        run: |
          {
            echo "### Linux package"
            echo
            echo "\`$(basename dist/vcut-gui-linux.tar.gz)\` — $(du -h dist/vcut-gui-linux.tar.gz | cut -f1)"
            echo
            echo "Download it from **Artifacts** at the bottom of this page."
          } >> "$GITHUB_STEP_SUMMARY"
      # The .deb and .rpm wrap the bundle that was just built rather than
      # building it again, so this costs seconds, not another full build.
      # Nothing is compiled, which is why no distro build service is needed.
      - name: Build the .deb and .rpm
        run: |
          sudo apt-get install -y rpm
          ./packaging/build-packages.sh
      - name: Check the packages
        run: |
          deb=dist/vcut-gui_*_amd64.deb
          rpm=dist/vcut-gui-*-1.x86_64.rpm
          dpkg-deb -I $deb
          # A package that declares no libmpv installs and then cannot show
          # AV1 -- the format this program recommends for Commons.
          dpkg-deb -I $deb | grep -q 'Depends:.*libmpv' \
            || { echo "::error::the .deb does not depend on libmpv"; exit 1; }
          stub=$(mktemp -d)
          rpm -qpR --dbpath "$stub" $rpm | grep -q mpv-libs \
            || { echo "::error::the .rpm does not depend on mpv-libs"; exit 1; }
          echo "deb $(du -h $deb | cut -f1), rpm $(du -h $rpm | cut -f1)"
      - uses: actions/upload-artifact@v5
        with:
          name: vcut-gui-linux
          path: dist/vcut-gui-linux.tar.gz
      - uses: actions/upload-artifact@v5
        with:
          name: vcut-gui-packages
          path: |
            dist/vcut-gui_*_amd64.deb
            dist/vcut-gui-*-1.x86_64.rpm
          if-no-files-found: error
          if-no-files-found: error
          retention-days: 90
          compression-level: 0   # already a .tar.gz; recompressing wastes minutes

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
      - run: uv python install ${{ env.VCUT_PYTHON }}
      - name: Build
        run: powershell -ExecutionPolicy Bypass -File packaging\build-windows.ps1
      - name: Check the archive
        shell: pwsh
        run: |
          if (-not (Test-Path dist\vcut-gui-windows.zip)) {
            throw "the archive was not produced"
          }
          $size = (Get-Item dist\vcut-gui-windows.zip).Length / 1MB
          Write-Host ("Size: {0:N1} MB" -f $size)
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [IO.Compression.ZipFile]::OpenRead((Resolve-Path dist\vcut-gui-windows.zip))
          try {
            $names = $zip.Entries | ForEach-Object { $_.FullName }
            # Match on the leaf rather than a fixed prefix: Compress-Archive
            # has varied the leading folder between PowerShell versions, and
            # a false failure here lands in the middle of a release.
            if (-not ($names | Where-Object { $_ -match 'vcut-gui\.exe$' })) {
              Write-Host "Archive contains:"; $names | Select-Object -First 20
              throw "vcut-gui.exe is not in the archive"
            }
            if ($names | Where-Object { $_ -match "(?i)webengine" }) {
              throw "Qt WebEngine is back in the bundle (see docs/BUILDING.md)"
            }
            # Without libmpv the player cannot decode AV1 -- the format this
            # program recommends for Commons -- so the picture would be a
            # black rectangle in the shipped build.
            if (-not ($names | Where-Object { $_ -match 'libmpv-2\.dll$' })) {
              throw "libmpv-2.dll is not in the archive: AV1 will not play"
            }
          } finally { $zip.Dispose() }
      - name: Say where the package is
        shell: pwsh
        run: |
          $mb = [math]::Round((Get-Item dist\vcut-gui-windows.zip).Length / 1MB, 1)
          @(
            "### Windows package"
            ""
            "``vcut-gui-windows.zip`` — $mb MB"
            ""
            "Download it from **Artifacts** at the bottom of this page."
            "GitHub wraps artifacts in a zip, so you get a zip inside a zip."
          ) | Add-Content -Path $env:GITHUB_STEP_SUMMARY
      - uses: actions/upload-artifact@v5
        with:
          name: vcut-gui-windows
          path: dist/vcut-gui-windows.zip
          if-no-files-found: error
          retention-days: 90
          compression-level: 0   # already a .zip

  wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
      - run: uv build
      # A wheel with broken metadata installs fine here and fails on PyPI.
      - name: Check the metadata
        run: uv run --with twine twine check dist/*
      - uses: actions/upload-artifact@v5
        with:
          name: vcut-gui-wheel
          path: dist/*
          if-no-files-found: error
          retention-days: 90

  release:
    needs: [linux, windows, wheel]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # The suite is not re-run here -- Tests already ran it for this commit
      # -- but a tag must not publish if it was red, so check the result
      # before anything is attached to a release.
      - uses: actions/checkout@v5
      - name: Require the tests to have passed for this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha="${{ github.sha }}"
          echo "Checking Tests for $sha"
          conclusion=$(gh run list --workflow Tests --commit "$sha" \
            --limit 1 --json conclusion --jq '.[0].conclusion // "missing"')
          echo "Tests concluded: $conclusion"
          if [ "$conclusion" != "success" ]; then
            echo "::error::Tests did not pass for $sha (got: $conclusion)."
            echo "Push the commit to master first and let Tests finish."
            exit 1
          fi
      - uses: actions/download-artifact@v6
        with:
          path: artifacts
          merge-multiple: true
      - name: List what is being released
        run: ls -lh artifacts/
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
          body: |
            See [CHANGELOG.md](../../blob/master/CHANGELOG.md) for what
            changed.

            **Linux:** install the `.deb` (Debian, Ubuntu) or `.rpm`
            (Fedora, openSUSE) and the program appears in your applications
            menu. The `.tar.gz` is the same build for any other distribution.

            **FFmpeg is not bundled.** Install it separately — see
            [INSTALL.md](../../blob/master/INSTALL.md). On Fedora it comes
            from RPM Fusion, which is why the `.rpm` does not require it.

            The Windows executable is unsigned, so SmartScreen warns on
            first run: **More info → Run anyway**.
