[project]
name = "vcut-gui"
version = "1.6.0"
description = "Cut conference recordings into per-session clips with Wikimedia Commons metadata"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "GPL-3.0-or-later" }
authors = [
    { name = "Ranjithsiji" },
    { name = "Mujeeb Rahman" },
]
keywords = ["video", "ffmpeg", "wikimedia", "commons", "conference", "pretalx"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: X11 Applications :: Qt",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Video :: Conversion",
]

dependencies = [
    "PySide6>=6.7",
    "httpx>=0.27",
    "jinja2>=3.1",
    "keyring>=25.7.0",
    "qtawesome>=1.3",
]

[project.urls]
Homepage = "https://github.com/Wikimedians-of-Kerala/vcut-gui"
Source = "https://github.com/Wikimedians-of-Kerala/vcut-gui"
Issues = "https://github.com/Wikimedians-of-Kerala/vcut-gui/issues"
Changelog = "https://github.com/Wikimedians-of-Kerala/vcut-gui/blob/master/CHANGELOG.md"

[project.optional-dependencies]
upload = [
    "pywikibot>=9.0",
]
dev = [
    "pywikibot>=9.0",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    # Reading the CI workflows in tests/test_packaging.py.
    "pyyaml>=6.0",
]

[project.scripts]
vcut = "vcut.cli:main"

[project.gui-scripts]
vcut-gui = "vcut.gui.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
# The packaging scripts leave a build venv behind; a virtual environment
# cannot go into an sdist (its absolute symlinks make the tar unusable).
exclude = [".venv", ".venv-build", "dist", "build", ".github"]

[tool.hatch.build.targets.wheel]
# The logo under src/vcut/gui/logo ships as package data automatically; a
# force-include for it adds the same file twice and fails the wheel build.
packages = ["src/vcut"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "needs_real_ffmpeg: the test runs FFmpeg rather than only building a command line",
]

[tool.ruff]
line-length = 100
target-version = "py311"
