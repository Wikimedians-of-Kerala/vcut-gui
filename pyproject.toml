[project]
name = "vcut-gui"
version = "0.1.0"
description = "Cut conference recordings into per-session clips with Wikimedia Commons metadata"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "GPL-3.0-or-later" }
dependencies = [
    "PySide6>=6.7",
    "httpx>=0.27",
    "jinja2>=3.1",
    "qtawesome>=1.3",
]

[project.optional-dependencies]
upload = [
    "pywikibot>=9.0",
]
dev = [
    "pywikibot>=9.0",
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[project.scripts]
vcut = "vcut.cli:main"

[project.gui-scripts]
vcut-gui = "vcut.gui.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vcut"]

[tool.hatch.build.targets.wheel.force-include]
"src/vcut/gui/logo" = "vcut/gui/logo"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
